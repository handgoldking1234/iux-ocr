<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
body{margin:16px;font-family:"Malgun Gothic",sans-serif;font-size:13px}
h3{margin:0 0 10px;color:#2d4a7a}
table{border-collapse:collapse;width:100%;max-width:820px}
th{background:#eef2f8;border:1px solid #c5cdd9;padding:7px;width:120px;text-align:left;font-weight:normal}
td{border:1px solid #c5cdd9;padding:5px}
input,select,textarea{font:inherit;border:1px solid #9aa7b8;padding:4px;width:98%}
input.s{width:180px}
textarea{height:120px}
.btns{margin-top:12px}
button{padding:6px 18px}
#ok{color:#12a150;margin-left:10px}
</style>
</head>
<body>
<h3>기록물 등록</h3>
<form id="f" onsubmit="event.preventDefault();document.getElementById('ok').textContent='저장되었습니다 (연습용)';">
<table>
<tr><th>제목 *</th><td><input name="ttl" maxlength="200"></td></tr>
<tr><th>생산기관</th><td><select name="org"><option value="">선택</option><option value="6110000">서울특별시장</option><option value="6110001">서울특별시 행정국</option><option value="6110002">서울특별시 기획조정실</option></select></td></tr>
<tr><th>문서번호</th><td><input name="docNo" class="s"></td></tr>
<tr><th>생산일자</th><td><input name="prodDt" class="s" placeholder="YYYY-MM-DD"></td></tr>
<tr><th>수신</th><td><input name="rcv"></td></tr>
<tr><th>사업기간</th><td><input name="period"></td></tr>
<tr><th>연락처</th><td><input name="tel"></td></tr>
<tr><th>붙임</th><td><input name="att"></td></tr>
<tr><th>본문 요약</th><td><textarea name="body"></textarea></td></tr>
</table>
<div class="btns"><button type="submit">저장</button><span id="ok"></span></div>
</form>
</body>
</html>
