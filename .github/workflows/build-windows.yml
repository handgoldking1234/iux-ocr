name: Windows 설치 파일 빌드

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "iux_ocr.py"
      - "iux_ocr.spec"
      - "requirements.txt"
      - "install/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tesseract + 한국어 데이터 준비
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { $src = Split-Path (Get-ChildItem "C:\Program*\Tesseract-OCR\tesseract.exe" | Select-Object -First 1).FullName }
          New-Item -ItemType Directory -Force -Path build_extra | Out-Null
          Copy-Item $src build_extra\tesseract -Recurse -Force
          foreach ($l in @("kor", "eng", "osd")) {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata/raw/main/$l.traineddata" -OutFile "build_extra\tesseract\tessdata\$l.traineddata"
          }
          & build_extra\tesseract\tesseract.exe --list-langs

      - name: exe 빌드 (PyInstaller)
        run: pyinstaller -y iux_ocr.spec

      - name: Tesseract 동봉
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\IUX OCR\bin" | Out-Null
          Copy-Item build_extra\tesseract "dist\IUX OCR\bin\tesseract" -Recurse -Force

      - name: 실행 확인 (서버 기동 + 샘플 인식)
        shell: pwsh
        run: |
          $env:IUX_OCR_WORKSPACE = "$env:RUNNER_TEMP\iuxws"
          $p = Start-Process -FilePath "dist\IUX OCR\IUX OCR.exe" -ArgumentList "--no-browser","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) { Start-Sleep 2; try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/engines; $ok = $true; break } catch {} }
          if (-not $ok) { throw "서버가 뜨지 않습니다" }
          $r.tesseract | ConvertTo-Json
          if (-not $r.tesseract.has_kor) { throw "한국어 Tesseract를 찾지 못했습니다" }
          $sample = Get-ChildItem samples\*.jpg | Select-Object -First 1
          $doc = Invoke-RestMethod -Uri http://127.0.0.1:8799/api/upload -Method Post -Form @{ files = $sample }
          $res = Invoke-RestMethod -Uri "http://127.0.0.1:8799/api/docs/$($doc[0].id)/ocr" -Method Post -ContentType "application/json" -Body '{"page":0}'
          "평균 신뢰도: $($res.result.mean_conf)"
          if (-not ($res.result.text -match "서울")) { throw "인식 결과가 이상합니다" }
          Stop-Process -Id $p.Id -Force

      - name: 설치 파일 만들기 (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $isccArgs = @("/DAppVersion=0.3.${{ github.run_number }}")
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\Languages\Korean.isl") { $isccArgs += "/DKOREAN" }
          & $iscc @isccArgs install\iux-ocr.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 파일 생성 실패" }

      - name: 포터블 zip
        shell: pwsh
        run: Compress-Archive -Path "dist\IUX OCR\*" -DestinationPath "dist\IUX-OCR-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: IUX-OCR-windows
          path: |
            dist/IUX-OCR-Setup.exe
            dist/IUX-OCR-portable.zip

      - name: 릴리스로 배포
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: IUX OCR 0.3.${{ github.run_number }} (Windows)
          body: |
            **IUX-OCR-Setup.exe** — 설치형. 파이썬·Tesseract(한국어) 포함, 인터넷 없이 설치·사용 가능.
            **IUX-OCR-portable.zip** — 설치 없이 압축만 풀어 `IUX OCR.exe` 실행 (USB 사용 가능).

            실행하면 브라우저에 http://127.0.0.1:8765 화면이 열립니다. 검은 창을 닫으면 종료됩니다.
            정확 모드(PaddleOCR)·AI(Ollama)는 README 안내에 따라 추가 설치합니다.
          files: |
            dist/IUX-OCR-Setup.exe
            dist/IUX-OCR-portable.zip
